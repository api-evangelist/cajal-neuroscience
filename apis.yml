aid: cajal-neuroscience
name: Cajal Neuroscience
description: 'Cajal Neuroscience, which now operates publicly as Cajal Therapeutics, is a
  Seattle, Washington biotechnology company founded in 2020 by Alex Vaughan, Andrew Dervan and
  Ian Peikon, and launched in November 2022 with a $96 million Series A led by The Column Group
  and Lux Capital with participation from Two Sigma Ventures and Bristol Myers Squibb. The
  company develops small-molecule and RNA medicines that restore iron homeostasis, built around
  "iron mobilizers" — small molecules that transport iron across membranes into the compartments
  where it is required, bypassing disease-driven bottlenecks such as chronic inflammation,
  altered iron transporter expression and lysosomal dysfunction. Its pipeline spans systemic
  disease (CTX001, a clinical-stage iron mobilizer for anemia of chronic kidney disease; CTX201
  and CTX211, preclinical siRNA programs for inflammatory anemia and myelofibrosis anemia) and
  CNS disease (a discovery-stage brain-penetrant iron mobilizer for Parkinson''s disease). This
  is a therapeutics company, not a software or data platform company: it publishes no developer
  program, no public API, and no machine-readable API contract. Its public GitHub organization
  contains open-source laboratory hardware and firmware (a drone-motor spin coater, a microfluidic
  pressure sensor, a flow sensor) plus forks of third-party single-cell and genomics analysis
  tooling — none of which expose a network API.'
